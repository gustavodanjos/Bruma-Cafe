<sly
    data-sly-use.contentGrid="com.brumacafe.core.models.ContentGridModel"
    data-sly-use.template="core/wcm/components/commons/v1/templates.html"
    data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html">
</sly>

<sly
    data-sly-call="${clientlib.css @ categories='brumacafe.components.content-grid'}">
</sly>

<div
    class="cmp-content-grid"
    data-sly-test.hasContent="${!contentGrid.empty}">

    <ul
        class="cmp-content-grid__grid"
        data-sly-list.item="${contentGrid.items}">

        <li class="cmp-content-grid__item">

            <div
                class="cmp-content-grid__media"
                data-sly-test="${item.fileReference}">

                <img
                    class="cmp-content-grid__image"
                    src="${item.fileReference}"
                    alt="${item.alt}"
                    loading="lazy"
                    decoding="async">

            </div>

            <div class="cmp-content-grid__content">

                <h2
                    class="cmp-content-grid__title"
                    data-sly-test="${item.title}">
                    ${item.title}
                </h2>

                <p
                    class="cmp-content-grid__text"
                    data-sly-test="${item.text}">
                    ${item.text}
                </p>

            </div>

        </li>

    </ul>

</div>

<sly
    data-sly-call="${template.placeholder @
        isEmpty=contentGrid.empty,
        emptyTextAppend='Clique em configurar para adicionar os blocos'}">
</sly>
