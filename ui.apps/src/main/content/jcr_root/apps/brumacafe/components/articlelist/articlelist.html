<sly data-sly-use.model="com.brumacafe.core.models.ArticleListModel"
     data-sly-use.template="core/wcm/components/commons/v1/templates.html">

    <sly data-sly-test="${wcmmode.edit && model.empty}">
        <div class="cq-placeholder" data-emptytext="Listagem de Artigos Bruma: Clique na chave inglesa para configurar o caminho e a quantidade"></div>
    </sly>

    <sly data-sly-test="${!model.empty}">
        <div class="bruma-article-hub" data-component="articlelist">

            <div class="bruma-article-filters" role="tablist" aria-label="Filtrar artigos por assunto">
                <button type="button"
                        class="bruma-filter-btn is-active"
                        data-filter="all"
                        role="tab"
                        aria-selected="true">
                    Todos
                </button>
                <sly data-sly-list.category="${model.categories}">
                    <button type="button"
                            class="bruma-filter-btn"
                            data-filter="${category}"
                            role="tab"
                            aria-selected="false">
                        ${category}
                    </button>
                </sly>
            </div>

            <p class="bruma-article-count">
                <span class="bruma-article-count__number">0</span> artigos encontrados
            </p>

            <div class="bruma-article-grid">
                <sly data-sly-list.article="${model.articles}">

                    <article class="bruma-article-card" data-category="${article.category}">
                        <a href="${article.path}" class="bruma-article-card__link">

                            <div class="bruma-article-card__image-wrapper">
                                <sly data-sly-test="${article.imagePath}">
                                    <img src="${article.imagePath}" alt="${article.title}" class="bruma-article-card__image"/>
                                </sly>
                                <sly data-sly-test="${!article.imagePath}">
                                    <div class="bruma-article-card__image-placeholder"></div>
                                </sly>
                            </div>

                            <div class="bruma-article-card__content">
                                <span class="bruma-article-card__category">${article.category}</span>

                                <h3 class="bruma-article-card__title">
                                    ${article.title}
                                </h3>

                                <sly data-sly-test="${article.description}">
                                    <p class="bruma-article-card__description">
                                        ${article.description}
                                    </p>
                                </sly>

                                <div class="bruma-article-card__meta">
                                    <span data-sly-test="${article.formattedDate}">${article.formattedDate}</span>
                                    <span data-sly-test="${!article.formattedDate}">${article.date @ format='dd/MM/yyyy'}</span>
                                    <span class="separator">·</span>
                                    <span>${article.readingTime} min de leitura</span>
                                </div>
                            </div>
                        </a>
                    </article>

                </sly>
            </div>

            <div class="bruma-article-empty-feedback" style="display: none;">
                <p>Nenhum artigo encontrado para este assunto.</p>
            </div>

        </div>
    </sly>
</sly>
