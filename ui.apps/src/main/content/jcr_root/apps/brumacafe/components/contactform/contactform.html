<section data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"
     class="cmp-contactform__wrapper">

    <article class="cmp-contactform__card">
        <header>
            <h3 class="cmp-contactform__title" data-sly-test="${properties.title}">${properties.title}</h3>
            <h3 class="cmp-contactform__title" data-sly-test="${!properties.title}">${'Envie uma mensagem' @ i18n}</h3>
        </header>

        <form class="cmp-contactform" id="brumaContactForm" action="${resource.path}.contact.json" method="POST">
            <fieldset class="cmp-contactform__row">
                <p class="cmp-contactform__field">
                    <label for="contact-name">${'Nome *' @ i18n}</label>
                    <input type="text" id="contact-name" name="name" placeholder="${'Seu nome' @ i18n}" required />
                </p>
                <p class="cmp-contactform__field">
                    <label for="contact-email">${'E-mail *' @ i18n}</label>
                    <input type="email" id="contact-email" name="email" placeholder="${'seu@email.com' @ i18n}" required />
                </p>
            </fieldset>

            <p class="cmp-contactform__field">
                <label for="contact-subject">${'Assunto' @ i18n}</label>
                <span class="cmp-contactform__select-wrapper">
                    <select id="contact-subject" name="subject">
                        <option value="" disabled selected>${'Selecione um assunto' @ i18n}</option>
                        <option value="Sou cliente e tenho uma dúvida">${'Sou cliente e tenho uma dúvida' @ i18n}</option>
                        <option value="Sou produtor e quero parceria">${'Sou produtor e quero parceria' @ i18n}</option>
                        <option value="Imprensa / Entrevista">${'Imprensa / Entrevista' @ i18n}</option>
                        <option value="Outros">${'Outros' @ i18n}</option>
                    </select>
                </span>
            </p>

            <p class="cmp-contactform__field">
                <label for="contact-message">${'Mensagem *' @ i18n}</label>
                <textarea id="contact-message" name="message" placeholder="${'Escreva sua mensagem aqui...' @ i18n}" required rows="5"></textarea>
            </p>

            <button type="submit" class="cmp-contactform__submit" id="contactSubmitBtn">${'Enviar mensagem' @ i18n}</button>

            <small class="cmp-contactform__disclaimer">${'Seus dados são usados apenas para responder sua mensagem. Nada de spam.' @ i18n}</small>
            
            <output class="cmp-contactform__message-box cmp-contactform__message-box--error" style="display: none;"></output>
        </form>

        <aside class="cmp-contactform__success" style="display: none;">
            <p class="cmp-contactform__success-text">${'Mensagem enviada com sucesso!' @ i18n}</p>
        </aside>
    </article>
</section>

<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=!properties.title, emptyTextAppend='Contact Form'}"></sly>
